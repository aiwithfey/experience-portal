<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What is wrong with you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#03040A;}
  body{
    font-family:'Cormorant Garamond',Georgia,serif;color:#DCE8FF;
    -webkit-tap-highlight-color:transparent;user-select:none;cursor:crosshair;
    touch-action:manipulation;
  }
  #stage{position:fixed;inset:0;overflow:hidden;background:#03040A;}
  canvas{position:absolute;inset:0;display:block;}

  /* ---- frost: sits over a COMPLETELY STATIC background, so the browser
          computes the blur once and caches it. Nothing beneath it ever
          animates — that is the whole performance story of this piece. ---- */
  #frost{position:absolute;inset:0;
    background:linear-gradient(152deg,rgba(190,202,222,.26),rgba(190,202,222,.08) 42%,
               rgba(190,202,222,.20) 78%,rgba(160,175,200,.26));
    backdrop-filter:blur(22px) saturate(.6);
    -webkit-backdrop-filter:blur(22px) saturate(.6);}

  /* static glass character — no blend modes, no animation */
  #dirt{position:absolute;inset:0;pointer-events:none;opacity:.6;
    background:
      radial-gradient(60% 45% at 8% 96%,rgba(10,12,20,.34),transparent 70%),
      radial-gradient(55% 40% at 94% 92%,rgba(10,12,20,.30),transparent 70%),
      radial-gradient(70% 30% at 50% 2%,rgba(10,12,20,.20),transparent 75%),
      radial-gradient(130% 85% at 20% 5%,rgba(255,255,255,.15),transparent 52%),
      radial-gradient(90% 70% at 88% 108%,rgba(255,255,255,.08),transparent 60%);}

  /* damage darkening lives ABOVE the frost, so changing it never re-blurs */
  #dmg{position:absolute;inset:0;pointer-events:none;background:#03040A;
    opacity:0;transition:opacity .25s linear;}

  #vign{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 120% at 50% 50%,transparent 55%,rgba(3,4,10,.55) 100%);}
  #flash{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0;}

  /* ---- reveal ---- */
  #truth{position:absolute;inset:0;display:flex;flex-direction:column;
    justify-content:center;align-items:center;text-align:center;
    padding:0 11vw;gap:1.15rem;opacity:0;pointer-events:none;
    transition:opacity 1.6s ease;}
  #truth .nothing{font-weight:300;font-size:clamp(3.2rem,11vw,8rem);line-height:1;
    letter-spacing:.14em;text-indent:.14em;color:#fff;
    text-shadow:0 0 60px rgba(160,190,255,.55);}
  #rule{width:0;height:1px;transition:width 2.4s ease;
    background:linear-gradient(90deg,transparent,rgba(220,232,255,.6),transparent);}
  #truth p{font-size:clamp(1.02rem,3.2vw,1.55rem);font-weight:300;line-height:1.55;
    color:rgba(220,232,255,.85);max-width:32ch;}
  #truth em{font-style:italic;color:#fff;}
  .fl{opacity:0;transform:translateY(14px);transition:opacity 1.7s ease,transform 1.7s ease;}

  #hint{position:absolute;left:0;right:0;bottom:max(7vh,2.6rem);text-align:center;
    font-size:.8rem;letter-spacing:.44em;text-transform:uppercase;
    color:rgba(255,255,255,.5);transition:opacity .5s ease;}
  #again{position:absolute;left:50%;transform:translateX(-50%);bottom:max(5.5vh,1.9rem);
    background:none;border:1px solid rgba(220,232,255,.26);color:rgba(220,232,255,.72);
    font-family:inherit;font-size:.76rem;letter-spacing:.36em;text-transform:uppercase;
    padding:.72rem 1.6rem;cursor:pointer;opacity:0;pointer-events:none;z-index:10;
    transition:opacity 1s ease 2.4s,background .3s,color .3s;}
  #again:hover,#again:focus-visible{background:rgba(220,232,255,.1);color:#fff;}
  :focus-visible{outline:1px solid rgba(220,232,255,.8);outline-offset:4px;}

  /* artist tag — deliberately a sibling of #stage, never inside it, so
     reaching for it can never land a hit on the glass */
  #credit{position:fixed;left:1.4rem;bottom:max(2.2vh,1rem);z-index:11;
    font-family:inherit;font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;
    color:rgba(220,232,255,.42);text-decoration:none;cursor:pointer;
    transition:color .4s ease;}
  #credit:hover,#credit:focus-visible{color:rgba(220,232,255,.9);}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>     <!-- galaxy: drawn ONCE, never animates -->
  <div   id="frost"></div>      <!-- blur, computed once and cached -->
  <div   id="dirt"></div>
  <canvas id="front"></canvas>  <!-- words + cracks: redrawn only on a hit -->
  <div   id="dmg"></div>
  <canvas id="fx"></canvas>     <!-- dust/shockwave: loops only while alive -->
  <canvas id="shards"></canvas> <!-- shatter animation -->
  <canvas id="rim"></canvas>    <!-- glass left clinging to the edges -->
  <div id="vign"></div>
  <div id="flash"></div>

  <div id="truth">
    <div class="nothing fl" id="t1">Nothing.</div>
    <div id="rule"></div>
    <p class="fl" id="t2">The question was the crack.</p>
    <p class="fl" id="t3">You are a piece of the universe, briefly<br>wondering whether it is <em>enough</em>.</p>
  </div>

  <div id="hint">hit the glass</div>
  <button id="again">Again</button>
</div>

<a id="credit" href="https://www.instagram.com/aiwithfey" target="_blank" rel="noopener noreferrer">AI with Fey</a>

<script>
(() => {
"use strict";

/* ======================================================================
   0. SETUP
   ====================================================================== */
const $ = id => document.getElementById(id);
const R = (a,b) => a + Math.random()*(b-a);
const TAU = Math.PI*2;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TOTAL_HITS = 5;

let W = innerWidth, H = innerHeight;
const DPR = Math.min(devicePixelRatio || 1, 2);

function fit(cv){
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  cv.style.width = W+'px'; cv.style.height = H+'px';
  const c = cv.getContext('2d');
  c.setTransform(DPR,0,0,DPR,0,0);
  return c;
}

const bgCv = $('bg'),   bg   = fit(bgCv);
const frCv = $('front'), fr  = fit(frCv);
const fxCv = $('fx'),   fx   = fit(fxCv);
const shCv = $('shards'), sh = fit(shCv);
const rmCv = $('rim'),  rm   = fit(rmCv);

let hits = 0, broken = false;
const impacts = [];   // {x,y,power}
const cracks  = [];   // {pts:[{x,y}...], w:number, a:number, dark:boolean}

/* ======================================================================
   1. BACKGROUND — stars + spiral galaxy. Drawn exactly once.
   ====================================================================== */
function drawBackground(){
  bg.clearRect(0,0,W,H);

  // deep space wash
  const wash = bg.createLinearGradient(0,0,W,H);
  wash.addColorStop(0,'#05060F'); wash.addColorStop(.5,'#04050C'); wash.addColorStop(1,'#03040A');
  bg.fillStyle = wash; bg.fillRect(0,0,W,H);

  // nebulae
  const neb = [
    {x:W*.10,y:H*.08,r:Math.max(W,H)*.75,c:[88,38,120],a:.34},
    {x:W*.92,y:H*.94,r:Math.max(W,H)*.70,c:[20,32,78], a:.42},
    {x:W*.55,y:H*.30,r:Math.max(W,H)*.45,c:[40,110,140],a:.16},
    {x:W*.62,y:H*.62,r:Math.max(W,H)*.28,c:[200,120,80],a:.08},
  ];
  for(const n of neb){
    const g = bg.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r);
    g.addColorStop(0,`rgba(${n.c[0]},${n.c[1]},${n.c[2]},${n.a})`);
    g.addColorStop(.55,`rgba(${n.c[0]},${n.c[1]},${n.c[2]},${n.a*.25})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    bg.fillStyle = g; bg.fillRect(0,0,W,H);
  }

  // field stars
  const count = Math.round(W*H/2200);
  for(let i=0;i<count;i++){
    const x=R(0,W), y=R(0,H), r=R(.25,1.5), a=R(.12,.92);
    if(r>1.15){
      const g=bg.createRadialGradient(x,y,0,x,y,r*5);
      g.addColorStop(0,`rgba(190,212,255,${a*.5})`); g.addColorStop(1,'rgba(0,0,0,0)');
      bg.fillStyle=g; bg.beginPath(); bg.arc(x,y,r*5,0,TAU); bg.fill();
    }
    bg.fillStyle=`rgba(220,232,255,${a})`;
    bg.beginPath(); bg.arc(x,y,r,0,TAU); bg.fill();
  }

  drawSpiral(W*.60, H*.40, Math.min(W,H)*.54, -0.5, 0.42, 2700, 1);
  drawSpiral(W*.15, H*.81, Math.min(W,H)*.085, 0.7, 0.55, 340, .55); // distant companion
}

function drawSpiral(cx,cy,rad,rot,tilt,n,strength){
  const cr=Math.cos(rot), sr=Math.sin(rot);

  // core bloom
  const core = bg.createRadialGradient(cx,cy,0,cx,cy,rad*.5);
  core.addColorStop(0,`rgba(255,238,208,${.30*strength})`);
  core.addColorStop(.22,`rgba(232,222,255,${.10*strength})`);
  core.addColorStop(1,'rgba(0,0,0,0)');
  bg.fillStyle=core;
  bg.save(); bg.translate(cx,cy); bg.rotate(rot); bg.scale(1,tilt);
  bg.beginPath(); bg.arc(0,0,rad*.56,0,TAU); bg.fill(); bg.restore();

  // disc haze
  bg.fillStyle=`rgba(160,180,230,${.045*strength})`;
  bg.save(); bg.translate(cx,cy); bg.rotate(rot); bg.scale(1,tilt);
  bg.beginPath(); bg.arc(0,0,rad*.97,0,TAU); bg.fill(); bg.restore();

  // arm stars
  for(let i=0;i<n;i++){
    const t = Math.pow(Math.random(), .58);
    const r = t*rad;
    const a = (i%2)*Math.PI + t*4.6 + R(-.42,.42)*(1-t*.55);
    const x0 = Math.cos(a)*r;
    const y0 = Math.sin(a)*r*tilt + R(-1,1)*(1-t)*r*.13;
    const x = cx + x0*cr - y0*sr;
    const y = cy + x0*sr + y0*cr;
    let col;
    if(t<.18) col='255,234,202';
    else if(t<.55) col='210,224,255';
    else if(Math.random()<.12) col='230,170,255';
    else col='185,205,250';
    const sz = R(.4,1.7)*(t<.18?1.5:1);
    bg.fillStyle=`rgba(${col},${R(.25,.95)*(1-t*.35)*strength})`;
    bg.beginPath(); bg.arc(x,y,sz,0,TAU); bg.fill();
  }
}

/* ======================================================================
   2. FRONT LAYER — the printed words + accumulated cracks.
      Redrawn once per hit. Never in a loop.
   ====================================================================== */
const LINES = ['WHAT','IS WRONG','WITH YOU'];

function wordMetrics(){
  const size = Math.min(Math.max(W*0.145, 42), 168);
  return { size, lh: size*0.92, nudge:[-size*0.34, 0, size*0.30] };
}

function drawWords(ctx, alpha){
  const {size, lh, nudge} = wordMetrics();
  ctx.save();
  ctx.font = `${size}px "Archivo Black", Impact, "Arial Black", sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const cy = H/2;
  for(let i=0;i<3;i++){
    const x = W/2 + nudge[i], y = cy + (i-1)*lh;
    ctx.shadowColor='rgba(3,4,10,.55)'; ctx.shadowBlur=size*.14; ctx.shadowOffsetY=size*.025;
    ctx.fillStyle=`rgba(238,243,252,${alpha})`;
    ctx.fillText(LINES[i], x, y);
    ctx.shadowBlur=0; ctx.shadowOffsetY=0;
    ctx.fillStyle=`rgba(255,255,255,${alpha*.16})`;
    ctx.fillText(LINES[i], x, y-1.5);   // top highlight, like paint catching light
  }
  ctx.restore();
}

function strokePolyline(ctx, pts, w, color, blur){
  if(pts.length<2) return;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.lineWidth=w; ctx.strokeStyle=color;
  ctx.lineCap='round'; ctx.lineJoin='round';
  if(blur){ ctx.shadowColor='rgba(255,255,255,.55)'; ctx.shadowBlur=blur; }
  ctx.stroke();
  if(blur){ ctx.shadowBlur=0; }
}

function drawFront(){
  fr.clearRect(0,0,W,H);
  drawWords(fr, Math.max(.35, 1 - hits*0.07));

  // impact bruises — crushed white glass at each strike point
  for(const im of impacts){
    const rad = 34 + im.power*13;
    const g = fr.createRadialGradient(im.x,im.y,0,im.x,im.y,rad);
    g.addColorStop(0,'rgba(255,255,255,.92)');
    g.addColorStop(.22,'rgba(255,255,255,.5)');
    g.addColorStop(.5,'rgba(232,240,252,.2)');
    g.addColorStop(1,'rgba(255,255,255,0)');
    fr.fillStyle=g; fr.beginPath(); fr.arc(im.x,im.y,rad,0,TAU); fr.fill();
  }

  // dark undersides first (depth), then bright fracture faces
  for(const c of cracks) if(c.dark)  strokePolyline(fr,c.pts,c.w*2.1,'rgba(3,4,10,.5)',0);
  for(const c of cracks) if(!c.dark) strokePolyline(fr,c.pts,c.w,`rgba(255,255,255,${c.a})`, c.w>1.2?3:0);

  // crushed splinters at the impact centres
  for(const im of impacts){
    fr.fillStyle='rgba(255,255,255,.8)';
    for(let m=0;m<12;m++){
      const a=R(0,TAU), r0=R(3,20), s=R(1.5,5);
      const px=im.x+Math.cos(a)*r0, py=im.y+Math.sin(a)*r0;
      fr.beginPath(); fr.moveTo(px,py);
      fr.lineTo(px+R(-s,s),py+R(-s,s)); fr.lineTo(px+R(-s,s),py+R(-s,s));
      fr.closePath(); fr.fill();
    }
  }
}

/* ---- crack geometry ---- */
function jagged(x,y,ang,len,step,spread){
  const pts=[{x,y}];
  let cx=x, cy=y, ca=ang, gone=0;
  while(gone<len){
    const seg=Math.min(step*R(.55,1.5), len-gone);
    ca += R(-spread,spread);
    cx += Math.cos(ca)*seg; cy += Math.sin(ca)*seg; gone += seg;
    pts.push({x:cx,y:cy});
  }
  return pts;
}

function fracture(x,y,power){
  impacts.push({x,y,power});
  const arms = Math.round(R(7,10)+power*2);
  const base = R(0,TAU);
  for(let i=0;i<arms;i++){
    const ang = base + i*(TAU/arms) + R(-.28,.28);
    const len = Math.min(W,H)*R(.22,.5)*(.72+power*.3);
    const pts = jagged(x,y,ang,len,24,.27);
    cracks.push({pts, w:R(2.4,4), a:.5, dark:true});
    cracks.push({pts, w:R(1.1,2.6), a:R(.6,.95), dark:false});
    if(Math.random()<.7){
      const b = pts[Math.floor(pts.length*R(.25,.72))];
      const bp = jagged(b.x,b.y, ang + R(.5,1.25)*(Math.random()<.5?-1:1), len*R(.32,.62),20,.32);
      cracks.push({pts:bp, w:R(.7,1.4), a:R(.45,.75), dark:false});
      if(Math.random()<.4){
        const c = bp[Math.floor(bp.length*R(.3,.7))];
        cracks.push({pts:jagged(c.x,c.y, ang+R(-.9,.9), len*R(.14,.3),16,.35),
                     w:R(.5,.9), a:R(.3,.55), dark:false});
      }
    }
  }
  // concentric splinter rings
  const rings = Math.round(R(2,4));
  for(let k=0;k<rings;k++){
    const rad = R(16,34)+k*R(20,44);
    const pts=[];
    for(let a=0;a<=TAU+.1;a+=.42){
      const rr=rad*R(.78,1.2);
      pts.push({x:x+Math.cos(a)*rr, y:y+Math.sin(a)*rr});
    }
    cracks.push({pts, w:R(.6,1.3), a:R(.35,.65), dark:false});
  }
}

/* ======================================================================
   3. FX LAYER — dust + shockwave. rAF runs ONLY while particles live.
   ====================================================================== */
let parts = [], rings = [], fxRunning = false;

function spawnFX(x,y,power){
  for(let i=0;i<18+power*4;i++){
    const a=R(0,TAU), sp=R(60,260+power*40);
    parts.push({x,y,vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, r:R(.8,2.2)});
  }
  rings.push({x,y,r:8,max:150+power*60,life:1});
  if(!fxRunning){ fxRunning=true; lastT=performance.now(); requestAnimationFrame(fxLoop); }
}

let lastT = 0;
function fxLoop(t){
  const dt = Math.min((t-lastT)/1000, .05); lastT = t;
  fx.clearRect(0,0,W,H);

  for(const p of parts){
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vy += 520*dt;                 // gravity
    p.vx *= .96; p.vy *= .99;
    p.life -= dt*1.5;
    if(p.life>0){
      fx.fillStyle=`rgba(255,255,255,${p.life*.9})`;
      fx.beginPath(); fx.arc(p.x,p.y,p.r,0,TAU); fx.fill();
    }
  }
  parts = parts.filter(p=>p.life>0);

  for(const g of rings){
    g.life -= dt*2.4;
    g.r += (g.max-g.r)*Math.min(1,dt*9);
    if(g.life>0){
      fx.strokeStyle=`rgba(255,255,255,${g.life*.55})`;
      fx.lineWidth=2*g.life+.4;
      fx.beginPath(); fx.arc(g.x,g.y,g.r,0,TAU); fx.stroke();
    }
  }
  rings = rings.filter(g=>g.life>0);

  if(parts.length || rings.length) requestAnimationFrame(fxLoop);
  else { fxRunning=false; fx.clearRect(0,0,W,H); }
}

/* ======================================================================
   4. QUAKE — scale-bounded, so the frame NEVER leaves fullscreen.
      A 1.6% scale-up gives 0.8% margin each side; the tiny translate
      stays well inside it, so no black edge can ever appear. Applied
      only to the printed layers (not the frost) so no blur recompute.
   ====================================================================== */
function quake(strength){
  if(REDUCED) return;
  const amp = Math.min(W,H)*0.004*strength;    // ~3px on a phone
  const dur = 150 + strength*30;
  const t0 = performance.now();
  const layers = [frCv, fxCv];
  function step(t){
    const k = (t-t0)/dur;
    if(k>=1){ layers.forEach(l=>{ l.style.transform=''; }); return; }
    const d = Math.pow(1-k, 2);
    const dx = Math.sin(k*38)*amp*d;
    const dy = Math.cos(k*29)*amp*d*.8;
    const sc = 1 + 0.016*d;
    const tf = `translate(${dx.toFixed(2)}px,${dy.toFixed(2)}px) scale(${sc.toFixed(4)})`;
    layers.forEach(l=>{ l.style.transform = tf; });
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ======================================================================
   5. AUDIO — built inside the first gesture, reused after.
      Every hit leads with a 2ms transient: that click is what makes an
      impact read as instantaneous to the ear.
   ====================================================================== */
let ac=null, master=null, nzLong=null, nzShort=null;

function buildNoise(seconds, decay){
  const b = ac.createBuffer(1, Math.max(1,Math.round(ac.sampleRate*seconds)), ac.sampleRate);
  const d = b.getChannelData(0);
  for(let i=0;i<d.length;i++){
    const t=i/d.length;
    d[i]=(Math.random()*2-1)*Math.pow(1-t,decay);
  }
  return b;
}

function initAudio(){
  if(ac) { if(ac.state==='suspended') ac.resume(); return; }
  try{
    ac = new (window.AudioContext||window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = .9; master.connect(ac.destination);
    nzLong  = buildNoise(.5,  3.6);
    nzShort = buildNoise(.02, 1.2);
    // unlock: a silent blip inside the gesture
    const s=ac.createBufferSource(); s.buffer=ac.createBuffer(1,1,ac.sampleRate);
    s.connect(master); s.start(0);
    if(ac.state==='suspended') ac.resume();
  }catch(e){ ac=null; }
}

function synth(power){
  if(!ac || !nzLong) return;
  /* Small lookahead. Scheduling exactly at currentTime is a coin flip:
     if the audio clock advances between the ramp calls, early events land
     in the past and get silently dropped. 12ms is inaudible as delay but
     guarantees every event is in the future. */
  const t = ac.currentTime + 0.012;

  // 1. transient click — the "now" of the hit
  const cs = ac.createBufferSource(); cs.buffer = nzShort;
  const chp = ac.createBiquadFilter(); chp.type='highpass'; chp.frequency.value=2600;
  const cg = ac.createGain(); cg.gain.value=.5;
  cs.connect(chp).connect(cg).connect(master); cs.start(t);

  // 2. glass crack body
  const ns = ac.createBufferSource(); ns.buffer = nzLong;
  ns.playbackRate.value = R(.9,1.15);
  const bp = ac.createBiquadFilter(); bp.type='bandpass';
  bp.frequency.value = 3000 - power*260; bp.Q.value=.9;
  const ng = ac.createGain();
  ng.gain.setValueAtTime(.34+power*.04, t);
  ng.gain.exponentialRampToValueAtTime(.0008, t+.26+power*.03);
  ns.connect(bp).connect(ng).connect(master); ns.start(t); ns.stop(t+.5);

  // 3. low thud — the hammer's weight
  const o = ac.createOscillator(), og = ac.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(42, t+.14);
  og.gain.setValueAtTime(.0001, t);
  og.gain.linearRampToValueAtTime(.5+power*.05, t+.004);
  og.gain.exponentialRampToValueAtTime(.0008, t+.28);
  o.connect(og).connect(master); o.start(t); o.stop(t+.3);

  // 4. glass tinkle
  for(let i=0;i<3;i++){
    const t0=t+.04+i*.045;
    const to=ac.createOscillator(), tg=ac.createGain();
    to.type='triangle'; to.frequency.value=R(1900,4400);
    tg.gain.setValueAtTime(.05,t0);
    tg.gain.exponentialRampToValueAtTime(.0008,t0+.16);
    to.connect(tg).connect(master); to.start(t0); to.stop(t0+.18);
  }
}

/* The first tap was silent because a brand-new AudioContext reports
   currentTime === 0 and its clock has not begun advancing yet; anything
   scheduled in that window is discarded. So: resume if needed, then wait
   (a frame or two at most) until the clock is genuinely running. */
function playHit(power){
  initAudio();
  if(!ac) return;
  const fire = () => {
    const t0 = performance.now();
    (function wait(){
      if(!ac) return;
      if(ac.currentTime > 0 || performance.now()-t0 > 150) synth(power);
      else requestAnimationFrame(wait);
    })();
  };
  if(ac.state === 'running') fire();
  else ac.resume().then(fire).catch(fire);
}

/* Debris settling — deliberately NOT an impact sound: no click, no thud,
   just glass falling. Keeps the shatter from reading as another hit. */
function glassFall(){
  if(!ac || !nzLong) return;
  const t = ac.currentTime + 0.012;
  for(let i=0;i<9;i++){
    const t0 = t + R(.02,.55);
    const o=ac.createOscillator(), g=ac.createGain();
    o.type='triangle'; o.frequency.value=R(2200,5200);
    g.gain.setValueAtTime(.038,t0);
    g.gain.exponentialRampToValueAtTime(.0006,t0+R(.12,.3));
    o.connect(g).connect(master); o.start(t0); o.stop(t0+.34);
  }
  const ns=ac.createBufferSource(); ns.buffer=nzLong;
  ns.playbackRate.value=.55;
  const hp=ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=1800;
  const g2=ac.createGain();
  g2.gain.setValueAtTime(.10,t);
  g2.gain.exponentialRampToValueAtTime(.0006,t+.7);
  ns.connect(hp).connect(g2).connect(master); ns.start(t); ns.stop(t+.9);
}

/* ======================================================================
   6. SHATTER — Voronoi cells, each pre-cut into its own small bitmap so
      the animation is pure drawImage (no per-frame clipping).
   ====================================================================== */
function clipHalf(poly,a,b){
  const mx=(a.x+b.x)/2, my=(a.y+b.y)/2, nx=b.x-a.x, ny=b.y-a.y, out=[];
  for(let i=0;i<poly.length;i++){
    const p=poly[i], q=poly[(i+1)%poly.length];
    const dp=(p.x-mx)*nx+(p.y-my)*ny, dq=(q.x-mx)*nx+(q.y-my)*ny;
    if(dp<=0) out.push(p);
    if((dp<0&&dq>0)||(dp>0&&dq<0)){
      const t=dp/(dp-dq);
      out.push({x:p.x+t*(q.x-p.x), y:p.y+t*(q.y-p.y)});
    }
  }
  return out;
}

function holePath(){
  const cx=W/2, cy=H/2, n=30, pts=[];
  for(let i=0;i<n;i++){
    const a=i/n*TAU;
    const rx=W*.5*R(.90,1.03), ry=H*.5*R(.88,1.03);
    const j=R(.95,1.06);
    pts.push({x:cx+Math.cos(a)*rx*j, y:cy+Math.sin(a)*ry*j});
  }
  const out=[];
  for(let i=0;i<n;i++){
    const p=pts[i], q=pts[(i+1)%n];
    out.push(p);
    out.push({x:(p.x+q.x)/2+R(-20,20), y:(p.y+q.y)/2+R(-20,20)});
  }
  return out;
}

function tracePath(ctx, pts){
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
}

function buildRim(hole){
  rm.clearRect(0,0,W,H);
  rm.save();
  // region = whole screen MINUS the hole  → only slivers remain
  rm.beginPath();
  rm.rect(0,0,W,H);
  rm.moveTo(hole[0].x, hole[0].y);
  for(let i=hole.length-1;i>=1;i--) rm.lineTo(hole[i].x, hole[i].y);
  rm.closePath();
  rm.clip('evenodd');

  // frosted body of the remaining glass
  const g = rm.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'rgba(190,202,222,.30)');
  g.addColorStop(.45,'rgba(190,202,222,.12)');
  g.addColorStop(1,'rgba(170,186,210,.28)');
  rm.fillStyle=g; rm.fillRect(0,0,W,H);
  // ghost of the words, still clinging to the shards at the edge
  rm.globalAlpha=.5; rm.drawImage(frCv,0,0,W,H); rm.globalAlpha=1;
  rm.restore();

  // the bright fracture edge of the hole
  rm.save();
  tracePath(rm,hole);
  rm.lineJoin='round'; rm.lineCap='round';
  rm.strokeStyle='rgba(3,4,10,.5)'; rm.lineWidth=6; rm.stroke();
  rm.strokeStyle='rgba(255,255,255,.9)'; rm.lineWidth=2.2;
  rm.shadowColor='rgba(255,255,255,.6)'; rm.shadowBlur=5; rm.stroke();
  rm.shadowBlur=0;
  rm.strokeStyle='rgba(255,255,255,.45)'; rm.lineWidth=.9; rm.stroke();
  // teeth
  rm.strokeStyle='rgba(255,255,255,.55)'; rm.lineWidth=.9;
  for(let i=0;i<hole.length;i++){
    const p=hole[i], a=R(0,TAU), l=R(4,15);
    rm.beginPath(); rm.moveTo(p.x,p.y);
    rm.lineTo(p.x+Math.cos(a)*l, p.y+Math.sin(a)*l); rm.stroke();
  }
  rm.restore();
}

let shardList = [], shatterT0 = 0;

function shatter(hx,hy){
  broken = true;
  const hole = holePath();

  // seeds: dense around impacts, sparse elsewhere
  const seeds=[];
  for(const im of impacts) for(let i=0;i<7;i++)
    seeds.push({x:im.x+R(-100,100), y:im.y+R(-100,100)});
  for(let i=0;i<26;i++) seeds.push({x:R(0,W), y:R(0,H)});

  const box=[{x:0,y:0},{x:W,y:0},{x:W,y:H},{x:0,y:H}];

  for(const s of seeds){
    let poly=box;
    for(const o of seeds){
      if(o===s) continue;
      poly=clipHalf(poly,s,o);
      if(poly.length<3) break;
    }
    if(poly.length<3) continue;

    let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9,cx=0,cy=0;
    for(const p of poly){
      minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x);
      minY=Math.min(minY,p.y); maxY=Math.max(maxY,p.y);
      cx+=p.x; cy+=p.y;
    }
    cx/=poly.length; cy/=poly.length;

    // pieces hugging the frame stay behind as the rim
    if(Math.min(cx,W-cx,cy,H-cy) < Math.min(W,H)*.035) continue;

    const bw=Math.ceil(maxX-minX)+2, bh=Math.ceil(maxY-minY)+2;
    if(bw<2||bh<2) continue;

    // pre-cut this piece into its own bitmap: animation becomes pure blitting
    const oc=document.createElement('canvas');
    oc.width=Math.round(bw*DPR); oc.height=Math.round(bh*DPR);
    const o=oc.getContext('2d');
    o.setTransform(DPR,0,0,DPR,0,0);
    o.translate(-minX+1,-minY+1);
    tracePath(o,poly); o.clip();
    const gg=o.createLinearGradient(minX,minY,maxX,maxY);
    gg.addColorStop(0,'rgba(198,210,230,.34)');
    gg.addColorStop(.5,'rgba(198,210,230,.12)');
    gg.addColorStop(1,'rgba(198,210,230,.28)');
    o.fillStyle=gg; o.fillRect(minX-2,minY-2,bw+4,bh+4);
    o.drawImage(frCv,0,0,W,H);
    tracePath(o,poly);
    o.strokeStyle='rgba(255,255,255,.4)'; o.lineWidth=1.2; o.stroke();

    const dx=cx-hx, dy=cy-hy;
    const dist=Math.max(50,Math.hypot(dx,dy));
    const boost=(560/dist)+.5;
    shardList.push({
      img:oc, w:bw, h:bh, ox:minX-1+bw/2, oy:minY-1+bh/2,
      vx:dx/dist*R(60,180)*boost + R(-40,40),
      vy:dy/dist*R(60,180)*boost + R(20,90),
      rot:0, vr:R(-3.4,3.4),
      delay:dist*R(.0002,.0009), life:1
    });
  }

  buildRim(hole);
  frCv.style.display='none';
  $('frost').style.display='none';
  $('dirt').style.display='none';
  $('dmg').style.display='none';

  const fl=$('flash');
  fl.style.transition='none'; fl.style.opacity='.62';
  requestAnimationFrame(()=>{ fl.style.transition='opacity 1.1s ease'; fl.style.opacity='0'; });

  /* No impact sound / jolt / dust here: the final strike in strike()
     already fired exactly one of each. Only falling debris follows. */
  setTimeout(glassFall, 60);

  shatterT0=performance.now();
  requestAnimationFrame(shardLoop);

  // reveal
  const truth=$('truth');
  setTimeout(()=>{ truth.style.opacity='1'; }, 700);
  ['t1','t2','t3'].forEach((id,i)=>setTimeout(()=>{
    const e=$(id); e.style.opacity='1'; e.style.transform='translateY(0)';
  }, 1000+i*1150));
  setTimeout(()=>{ $('rule').style.width='min(240px,42vw)'; }, 1500);
  const ag=$('again'); ag.style.opacity='1'; ag.style.pointerEvents='auto';
  $('stage').style.cursor='default';
  $('hint').style.opacity='0';
}

function shardLoop(t){
  const e=(t-shatterT0)/1000;
  sh.clearRect(0,0,W,H);
  let alive=false;
  for(const s of shardList){
    const lt=e-s.delay;
    if(lt<0){ alive=true;
      sh.drawImage(s.img, s.ox-s.w/2, s.oy-s.h/2, s.w, s.h);
      continue; }
    if(lt>1.9) continue;
    alive=true;
    const a=1-lt/1.9;
    const x=s.ox + s.vx*lt;
    const y=s.oy + s.vy*lt + 620*lt*lt*.5;   // gravity
    sh.save();
    sh.globalAlpha=Math.max(0,a);
    sh.translate(x,y); sh.rotate(s.vr*lt);
    sh.drawImage(s.img,-s.w/2,-s.h/2,s.w,s.h);
    sh.restore();
  }
  if(alive) requestAnimationFrame(shardLoop);
  else sh.clearRect(0,0,W,H);
}

/* ======================================================================
   7. INTERACTION
   ====================================================================== */
let lastStrike = 0;

function strike(x,y){
  if(broken) return;

  const isFinal = (hits+1) >= TOTAL_HITS;
  hits++;

  if(isFinal){
    /* Lock input right now. Previously the glass only locked once shatter()
       ran 200ms later, which left a window for a stray second pointerdown —
       and shatter() then added its own sound and jolt on top of this one,
       so the finale read as two or three hits instead of one. */
    broken = true;

    fracture(x,y,hits);
    drawFront();

    playHit(7);        // ONE sound, the heaviest
    quake(1.9);        // ONE jolt
    spawnFX(x,y,7);    // ONE burst
    $('dmg').style.opacity = String(Math.min(.42, hits*0.055));

    // just long enough for the killing crack to register, then it gives way
    setTimeout(() => shatter(x,y), 110);
    return;
  }

  playHit(hits);
  fracture(x,y,hits);
  drawFront();
  spawnFX(x,y,hits);
  quake(1);
  $('dmg').style.opacity = String(Math.min(.42, hits*0.055));
  if(hits===1) $('hint').style.opacity='0';
}

// pointerdown fires earlier than click/touchend — least possible input latency
$('stage').addEventListener('pointerdown', e => {
  if(e.target.id === 'again') return;
  if(e.isPrimary === false) return;         // ignore extra fingers
  const now = performance.now();
  if(now - lastStrike < 70) return;         // ignore duplicate/ghost events
  lastStrike = now;
  initAudio();
  strike(e.clientX, e.clientY);
});
addEventListener('keydown', e => {
  if((e.key===' '||e.key==='Enter') && !broken){
    e.preventDefault();
    initAudio();
    strike(R(W*.2,W*.8), R(H*.2,H*.8));
  }
});
$('again').addEventListener('click', e => { e.stopPropagation(); location.reload(); });

/* ======================================================================
   8. BOOT
   ====================================================================== */
function firstCrack(){
  const x=W*.63, y=H*.36;
  cracks.push({pts:jagged(x,y,R(1.6,2.2),Math.min(W,H)*.17,22,.22), w:.9, a:.4, dark:false});
  cracks.push({pts:jagged(x,y,R(-1.4,-.9),Math.min(W,H)*.10,18,.25), w:.6, a:.3, dark:false});
}

drawBackground();
firstCrack();
drawFront();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(drawFront).catch(()=>{});

let rz;
addEventListener('resize', () => {
  clearTimeout(rz);
  rz = setTimeout(() => {
    if(broken) return;
    W=innerWidth; H=innerHeight;
    fit(bgCv); fit(frCv); fit(fxCv); fit(shCv); fit(rmCv);
    drawBackground(); drawFront();
  }, 180);
});
})();
</script>
